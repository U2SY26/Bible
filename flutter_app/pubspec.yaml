name: graph_bible
description: "그래프 성경 - 성경 인물 관계도 시각화 앱"
publish_to: 'none'
version: 1.3.3+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Data & Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Text-to-Speech
  flutter_tts: ^3.8.5

  # Ads
  google_mobile_ads: ^5.1.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.3
  firebase_remote_config: ^5.4.0

  # App Info
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

  # Local Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

  # Visual Effects & Animations (custom implementation)

  # HTTP
  http: ^1.3.0

  # Utilities
  collection: ^1.18.0
  intl: ^0.20.2
  equatable: ^2.0.5

  # Share
  share_plus: ^12.0.1

  # Video Player
  video_player: ^2.8.2

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1
  freezed: ^2.4.7

  # App Icon & Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

# Splash Screen Configuration
flutter_native_splash:
  color: "#0a0a0f"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#0a0a0f"
    image: "assets/icon/splash_logo.png"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icon/
    - assets/video/
