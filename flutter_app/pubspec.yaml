name: graph_bible
description: "그래프 성경 - 성경 인물 관계도 시각화 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Data & Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Text-to-Speech
  flutter_tts: ^3.8.5

  # Utilities
  collection: ^1.18.0
  intl: ^0.20.2
  equatable: ^2.0.5

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1
  freezed: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/data/
