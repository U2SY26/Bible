<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#0f1f33"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  
  <!-- 연결선 -->
  <g stroke="#5a9fcf" stroke-width="3" opacity="0.5">
    <line x1="256" y1="256" x2="160" y2="170"/>
    <line x1="256" y1="256" x2="352" y2="170"/>
    <line x1="256" y1="256" x2="160" y2="342"/>
    <line x1="256" y1="256" x2="352" y2="342"/>
    <line x1="160" y1="170" x2="352" y2="170"/>
    <line x1="160" y1="342" x2="352" y2="342"/>
  </g>
  
  <!-- 노드 4개 -->
  <g filter="url(#glow)">
    <circle cx="160" cy="170" r="22" fill="#64b5f6"/>
    <circle cx="352" cy="170" r="22" fill="#64b5f6"/>
    <circle cx="160" cy="342" r="22" fill="#64b5f6"/>
    <circle cx="352" cy="342" r="22" fill="#64b5f6"/>
  </g>
  
  <!-- 중앙 - 십자가 -->
  <g filter="url(#glow)" stroke="#d4af37" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="210" x2="256" y2="310"/>
    <line x1="220" y1="240" x2="292" y2="240"/>
  </g>
  
  <!-- 중앙 노드 -->
  <circle cx="256" cy="256" r="70" fill="none" stroke="#d4af37" stroke-width="4" opacity="0.5"/>
</svg>
